name = "go-direct-chat-worker"
main = "src/index.js"
compatibility_date = "2026-04-24"

[vars]
BUSINESS_NAME = "Go Direct Home Services"
OPENROUTER_MODEL = "openai/gpt-4o-mini"
ALLOWED_ORIGINS = "https://go.govdirect.org"
ESTIMATE_URL = "https://go.govdirect.org/free-estimate.html"

# Add the OpenRouter key as an encrypted secret:
